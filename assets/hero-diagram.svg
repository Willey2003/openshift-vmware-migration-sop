<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Red Hat Display, Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1f22"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8231d"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f6f4ef"/>

  <!-- title -->
  <text x="60" y="78" font-size="16" font-weight="700" letter-spacing="3" fill="#b8231d">THE LAB MANUAL · MIGRATION EDITION</text>
  <text x="60" y="128" font-size="44" font-weight="800" fill="#1d1f22">The VMware-to-OpenShift Migration Pipeline</text>
  <text x="60" y="164" font-size="20" fill="#5f6670">How one vSphere VM becomes a KubeVirt VM: read, convert, copy, recreate. A cold migration only reads the source VM.</text>

  <!-- ============ column 1: vSphere ============ -->
  <rect x="60" y="210" width="380" height="470" rx="14" fill="#ffffff" stroke="#1d1f22" stroke-width="2"/>
  <rect x="60" y="210" width="380" height="54" rx="14" fill="#1d1f22"/>
  <rect x="60" y="244" width="380" height="20" fill="#1d1f22"/>
  <text x="84" y="246" font-size="22" font-weight="700" fill="#ffffff">1 · VMware vSphere 8</text>
  <text x="84" y="300" font-size="16" fill="#5f6670">vCenter + ESXi hosts (source)</text>

  <rect x="90" y="322" width="320" height="120" rx="10" fill="#eef1f4" stroke="#8a96a5"/>
  <text x="110" y="354" font-size="20" font-weight="700" fill="#1d1f22">Virtual machine</text>
  <text x="110" y="384" font-size="16" fill="#1d1f22">vCPU · RAM · BIOS/EFI · MAC</text>
  <text x="110" y="410" font-size="16" fill="#1d1f22">VMware Tools</text>
  <text x="110" y="432" font-size="14" fill="#5f6670">e.g. ubuntu 24.04, 2 vCPU, 1 GiB</text>

  <rect x="90" y="462" width="150" height="90" rx="10" fill="#eef1f4" stroke="#8a96a5"/>
  <text x="108" y="494" font-size="18" font-weight="700" fill="#1d1f22">VMDK</text>
  <text x="108" y="520" font-size="14" fill="#5f6670">on a datastore</text>
  <text x="108" y="540" font-size="14" fill="#5f6670">(VMFS/NFS/vSAN)</text>

  <rect x="260" y="462" width="150" height="90" rx="10" fill="#eef1f4" stroke="#8a96a5"/>
  <text x="278" y="494" font-size="18" font-weight="700" fill="#1d1f22">Port group</text>
  <text x="278" y="520" font-size="14" fill="#5f6670">VLAN ID on a</text>
  <text x="278" y="540" font-size="14" fill="#5f6670">vSwitch / VDS</text>

  <rect x="90" y="572" width="320" height="86" rx="10" fill="#fbf2e2" stroke="#a0640b"/>
  <text x="108" y="602" font-size="16" font-weight="700" fill="#7a4a06">Read path</text>
  <text x="108" y="626" font-size="14" fill="#1d1f22">VDDK: ESXi NBD, port 902 (fast)</text>
  <text x="108" y="646" font-size="14" fill="#1d1f22">No VDDK: HTTPS via vCenter, 443 (slow)</text>

  <!-- arrow 1 -> 2 -->
  <line x1="446" y1="445" x2="514" y2="445" stroke="#1d1f22" stroke-width="3" marker-end="url(#ar)"/>
  <text x="452" y="430" font-size="13" fill="#5f6670">inventory</text>
  <text x="452" y="470" font-size="13" fill="#5f6670">+ disks</text>

  <!-- ============ column 2: MTV ============ -->
  <rect x="520" y="210" width="520" height="470" rx="14" fill="#ffffff" stroke="#b8231d" stroke-width="2.5"/>
  <rect x="520" y="210" width="520" height="54" rx="14" fill="#b8231d"/>
  <rect x="520" y="244" width="520" height="20" fill="#b8231d"/>
  <text x="544" y="246" font-size="22" font-weight="700" fill="#ffffff">2 · Migration Toolkit for Virtualization</text>
  <text x="544" y="300" font-size="16" fill="#5f6670">MTV operator (Forklift) in namespace openshift-mtv</text>

  <!-- objects row -->
  <g font-size="15" fill="#1d1f22">
    <rect x="544" y="318" width="112" height="62" rx="8" fill="#f7e9e6" stroke="#b8231d"/>
    <text x="558" y="345" font-weight="700">Provider</text>
    <text x="558" y="367" font-size="13" fill="#5f6670">vCenter + creds</text>
    <rect x="668" y="318" width="112" height="62" rx="8" fill="#f7e9e6" stroke="#b8231d"/>
    <text x="682" y="345" font-weight="700">NetworkMap</text>
    <text x="682" y="367" font-size="13" fill="#5f6670">PG → NAD</text>
    <rect x="792" y="318" width="112" height="62" rx="8" fill="#f7e9e6" stroke="#b8231d"/>
    <text x="806" y="345" font-weight="700">StorageMap</text>
    <text x="806" y="367" font-size="13" fill="#5f6670">datastore → SC</text>
    <rect x="916" y="318" width="100" height="62" rx="8" fill="#f7e9e6" stroke="#b8231d"/>
    <text x="930" y="345" font-weight="700">Plan</text>
    <text x="930" y="367" font-size="13" fill="#5f6670">cold / warm</text>
  </g>
  <text x="544" y="410" font-size="15" font-weight="700" fill="#1d1f22">Migration (the Start button) runs the pipeline:</text>

  <!-- pipeline -->
  <g font-size="15" fill="#1d1f22">
    <rect x="544" y="426" width="472" height="40" rx="8" fill="#eef1f4"/>
    <text x="560" y="452"><tspan font-weight="700">Initialize</tspan>  ·  validate plan, look up VM</text>
    <rect x="544" y="472" width="472" height="40" rx="8" fill="#eef1f4"/>
    <text x="560" y="498"><tspan font-weight="700">DiskAllocation</tspan>  ·  create the target PVCs</text>
    <rect x="544" y="518" width="472" height="40" rx="8" fill="#f7e9e6" stroke="#b8231d"/>
    <text x="560" y="544"><tspan font-weight="700">ImageConversion</tspan>  ·  virt-v2v: virtio drivers, guest agent</text>
    <rect x="544" y="564" width="472" height="40" rx="8" fill="#eef1f4"/>
    <text x="560" y="590"><tspan font-weight="700">DiskTransfer</tspan>  ·  copy blocks into the PVC</text>
    <rect x="544" y="610" width="472" height="40" rx="8" fill="#eef1f4"/>
    <text x="560" y="636"><tspan font-weight="700">VirtualMachineCreation</tspan>  ·  same CPU, RAM, MAC</text>
  </g>

  <!-- arrow 2 -> 3 -->
  <line x1="1046" y1="445" x2="1114" y2="445" stroke="#1d1f22" stroke-width="3" marker-end="url(#ar)"/>
  <text x="1050" y="430" font-size="13" fill="#5f6670">VM +</text>
  <text x="1050" y="470" font-size="13" fill="#5f6670">disks</text>

  <!-- ============ column 3: OpenShift Virtualization ============ -->
  <rect x="1120" y="210" width="420" height="470" rx="14" fill="#ffffff" stroke="#1d1f22" stroke-width="2"/>
  <rect x="1120" y="210" width="420" height="54" rx="14" fill="#1d1f22"/>
  <rect x="1120" y="244" width="420" height="20" fill="#1d1f22"/>
  <text x="1144" y="246" font-size="22" font-weight="700" fill="#ffffff">3 · OpenShift Virtualization</text>
  <text x="1144" y="300" font-size="16" fill="#5f6670">KubeVirt on OpenShift 4.22 (target)</text>

  <rect x="1150" y="322" width="360" height="132" rx="10" fill="#eef1f4" stroke="#8a96a5"/>
  <text x="1170" y="352" font-size="20" font-weight="700" fill="#1d1f22">VirtualMachine</text>
  <rect x="1170" y="366" width="320" height="74" rx="8" fill="#ffffff" stroke="#8a96a5" stroke-dasharray="5 4"/>
  <text x="1188" y="396" font-size="16" font-weight="700" fill="#1d1f22">virt-launcher Pod</text>
  <text x="1188" y="422" font-size="14" fill="#5f6670">QEMU/KVM runs the guest inside a Pod</text>

  <rect x="1150" y="474" width="170" height="104" rx="10" fill="#eef1f4" stroke="#8a96a5"/>
  <text x="1168" y="506" font-size="18" font-weight="700" fill="#1d1f22">PVC</text>
  <text x="1168" y="530" font-size="14" fill="#5f6670">StorageClass via CSI</text>
  <text x="1168" y="550" font-size="14" fill="#5f6670">(lab: NFS CSI)</text>
  <text x="1168" y="570" font-size="14" font-weight="700" fill="#2f7d4f">RWX → live migration</text>

  <rect x="1340" y="474" width="170" height="104" rx="10" fill="#eef1f4" stroke="#8a96a5"/>
  <text x="1358" y="506" font-size="18" font-weight="700" fill="#1d1f22">NAD</text>
  <text x="1358" y="530" font-size="14" fill="#5f6670">linux bridge + VLAN</text>
  <text x="1358" y="550" font-size="14" fill="#5f6670">built with NMState</text>
  <text x="1358" y="570" font-size="14" fill="#5f6670">(NNCP on node NIC)</text>

  <rect x="1150" y="596" width="360" height="62" rx="10" fill="#e9f5ee" stroke="#2f7d4f"/>
  <text x="1168" y="623" font-size="15" font-weight="700" fill="#1f5c38">Kept from the source</text>
  <text x="1168" y="645" font-size="14" fill="#1d1f22">MAC · disk serials · BIOS serial · CPU layout</text>

  <!-- concept mapping strip -->
  <rect x="60" y="712" width="1480" height="118" rx="14" fill="#1d1f22"/>
  <text x="90" y="748" font-size="15" font-weight="700" letter-spacing="2" fill="#ff8a80">TRANSLATE THE CONCEPTS</text>
  <g font-size="20" fill="#ffffff">
    <text x="90" y="792">VMDK <tspan fill="#ff8a80">→</tspan> PVC</text>
    <text x="330" y="792">Port group <tspan fill="#ff8a80">→</tspan> NAD</text>
    <text x="620" y="792">vSwitch <tspan fill="#ff8a80">→</tspan> NMState bridge</text>
    <text x="960" y="792">vMotion <tspan fill="#ff8a80">→</tspan> Live migration</text>
    <text x="1270" y="792">Tools <tspan fill="#ff8a80">→</tspan> guest agent</text>
  </g>
  <text x="90" y="818" font-size="14" fill="#aab3bd">ESXi host → node with /dev/kvm  ·  VM template → instance type + preference  ·  datastore policy → StorageClass</text>

  <!-- footer -->
  <text x="60" y="868" font-size="15" fill="#5f6670">Lab-validated: OpenShift 4.22.15 · OpenShift Virtualization 4.22.9 · MTV 2.12.9 · vSphere 8</text>
  <text x="1540" y="868" font-size="15" font-weight="700" fill="#1d1f22" text-anchor="end">github.com/Willey2003/openshift-vmware-migration-sop</text>
</svg>
