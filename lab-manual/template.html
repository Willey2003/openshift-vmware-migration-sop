<title>$pagetitle$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:ital,wght@0,400;0,500;0,700;1,400&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
/* Field-manual layout: cover, sticky contents rail, chapter openers, terminal windows with a title bar, typed callout boxes. */
:root{
  --bg:#f3f1ec; --paper:#fffdf9; --fg:#1d1f22; --muted:#5f6670; --line:#dcd8cf;
  --accent:#b8231d; --accent-soft:#f7e9e6;
  --term-bg:#14171c; --term-fg:#d9e1e8; --term-bar:#262b33; --term-title:#9aa5b1; --ref-bg:#1d2229;
  --note:#2d6a9f; --note-bg:#eaf2f9; --tip:#2f7d4f; --tip-bg:#e9f5ee; --gotcha:#b8231d; --gotcha-bg:#fbeceb;
  --exam:#6b4aa8; --exam-bg:#f1ecf9; --lab:#a0640b; --lab-bg:#fbf2e2; --prod:#7a5a12; --prod-bg:#fff6df;
  --shot:#8a8f98; --shot-bg:#f4f3ef;
  --f-display:"Red Hat Display",system-ui,sans-serif;
  --f-body:"Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --paper:#181b1f; --fg:#e6e8eb; --muted:#9ba3ad; --line:#2c3036; --accent:#ff6b5e; --accent-soft:#2a1b1a;
  --term-bg:#0b0d10; --term-bar:#1d2127; --ref-bg:#14181d;
  --note:#7fb3e6; --note-bg:#16222e; --tip:#7fd1a0; --tip-bg:#14251b; --gotcha:#ff8a80; --gotcha-bg:#2b1716;
  --exam:#b9a2ee; --exam-bg:#211a30; --lab:#f0b860; --lab-bg:#2a2112; --prod:#e6c36a; --prod-bg:#2a2412;
  --shot:#7d848e; --shot-bg:#1d2024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --paper:#181b1f; --fg:#e6e8eb; --muted:#9ba3ad; --line:#2c3036; --accent:#ff6b5e; --accent-soft:#2a1b1a;
  --term-bg:#0b0d10; --term-bar:#1d2127; --ref-bg:#14181d;
  --note:#7fb3e6; --note-bg:#16222e; --tip:#7fd1a0; --tip-bg:#14251b; --gotcha:#ff8a80; --gotcha-bg:#2b1716;
  --exam:#b9a2ee; --exam-bg:#211a30; --lab:#f0b860; --lab-bg:#2a2112; --prod:#e6c36a; --prod-bg:#2a2412;
  --shot:#7d848e; --shot-bg:#1d2024; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--f-body);margin:0;padding:0 16px}
.cover{max-width:1240px;margin:24px auto 0;background:var(--fg);color:var(--paper);border-radius:6px;padding:48px clamp(20px,5vw,64px) 40px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border:28px solid var(--accent);border-radius:50%;opacity:.9}
.cover>*{position:relative;z-index:1}
@media (max-width:600px){.cover::after{width:120px;height:120px;border-width:14px;right:-50px;top:-50px}}
.cover .kicker{font:700 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);filter:brightness(1.4)}
.cover h1{font:900 clamp(34px,6vw,64px)/1.02 var(--f-display);margin:18px 0 14px;max-width:16ch;letter-spacing:-.01em}
.cover .sub{max-width:62ch;opacity:.85;margin:0 0 18px}
.cover .who{font-weight:700;margin:0 0 22px}
.cover .versions{display:flex;flex-wrap:wrap;gap:6px}
.cover .versions span{font:500 12px/1 var(--f-mono);border:1px solid color-mix(in srgb,currentColor 40%,transparent);padding:6px 8px;border-radius:3px}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;padding-block:28px 80px}
nav.toc{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;font-size:13.5px;padding-right:8px}
nav.toc .label{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
nav.toc ul{list-style:none;margin:0;padding:0}
nav.toc ul ul{padding-left:12px;border-left:1px solid var(--line);margin:4px 0 8px}
nav.toc a{color:var(--fg);text-decoration:none;display:block;padding:3px 0}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--accent)}
nav.toc>ul>li>a{font-weight:700;margin-top:6px}
main{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px clamp(18px,4vw,56px) 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;scroll-margin-top:16px}
main h1{font-size:34px;font-weight:900;margin:64px 0 16px;padding-top:28px;border-top:3px solid var(--fg)}
main h1:first-child{margin-top:24px}
main h1 .eyebrow{display:block;font:700 13px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
main h2{font-size:22px;margin:40px 0 10px}
main h3{font-size:17px;margin:28px 0 8px}
p,li{max-width:78ch}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
pre{background:var(--ref-bg);color:var(--term-fg);padding:14px 16px;border-radius:5px;overflow-x:auto;font:12.5px/1.5 var(--f-mono);margin:14px 0}
pre code{background:none;padding:0;color:inherit;font-size:inherit}
.term{margin:16px 0;border-radius:6px;overflow:hidden;border:1px solid #2a2f37;background:var(--term-bg)}
.term .bar{display:flex;align-items:center;gap:7px;background:var(--term-bar);padding:7px 12px;font:500 12px/1 var(--f-mono);color:var(--term-title)}
.term .bar i{width:10px;height:10px;border-radius:50%;background:#e0584c;display:inline-block}
.term .bar i:nth-child(2){background:#e0b03c}.term .bar i:nth-child(3){background:#5fb760}
.term .bar span{margin-left:8px}
.term pre{margin:0;border-radius:0;background:var(--term-bg)}
.term .prompt{color:#8fd18f;font-weight:500}
.table-wrap{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--fg);color:var(--paper);font:700 11.5px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
blockquote{margin:18px 0;padding:12px 16px;border-left:5px solid var(--note);background:var(--note-bg);border-radius:0 4px 4px 0}
blockquote p{margin:6px 0}
blockquote p:first-child strong:first-child{font:700 11.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:6px;color:var(--note)}
blockquote.tip{border-color:var(--tip);background:var(--tip-bg)}blockquote.tip p:first-child strong:first-child{color:var(--tip)}
blockquote.gotcha{border-color:var(--gotcha);background:var(--gotcha-bg)}blockquote.gotcha p:first-child strong:first-child{color:var(--gotcha)}
blockquote.exam{border-color:var(--exam);background:var(--exam-bg)}blockquote.exam p:first-child strong:first-child{color:var(--exam)}
blockquote.lab{border-color:var(--lab);background:var(--lab-bg)}blockquote.lab p:first-child strong:first-child{color:var(--lab)}
blockquote.prod{border-color:var(--prod);background:var(--prod-bg)}blockquote.prod p:first-child strong:first-child{color:var(--prod)}
blockquote.shot{border:1.5px dashed var(--shot);background:var(--shot-bg);border-radius:4px;font-size:14.5px}
blockquote.shot p:first-child strong:first-child{color:var(--muted);font-family:var(--f-mono)}
figure{margin:18px 0}figure img{max-width:100%;border:1px solid var(--line);border-radius:4px}
figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
img{max-width:100%}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}nav.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--paper)}}
@media print{
  body{background:#fff;padding:0;font-size:10.5pt}
  .cover{border-radius:0;margin:0;min-height:96vh;break-after:page}
  .wrap{display:block;padding:0}
  nav.toc{position:static;max-height:none;break-after:page;font-size:10pt}
  main{border:0;padding:0}
  main h1{break-before:page;border-top:0;margin-top:0}
  .term,pre,table,blockquote,figure{break-inside:avoid}
  pre{white-space:pre-wrap;word-break:break-all;font-size:8pt}
}
</style>
<header class="cover">
<div class="kicker">$docid$</div>
<h1>$title$</h1>
<p class="sub">$subtitle$</p>
<p class="who">$author$ · $date$</p>
<div class="versions">$versions$</div>
</header>
<div class="wrap">
<nav class="toc" aria-label="Contents"><p class="label">Contents</p>
$toc$
</nav>
<main>
$body$
</main>
</div>
